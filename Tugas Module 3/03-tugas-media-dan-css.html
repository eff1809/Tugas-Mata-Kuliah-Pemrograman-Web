<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Multimedia E-Learning</title>
    <!-- Menghubungkan file CSS eksternal -->
    <link rel="stylesheet" href="03-tugas-style.css">
</head>
<body>

    <!-- Area utama untuk menampung kartu e-learning -->
    <main class="container">
        <!-- BEM Block: media-card -->
        <article class="media-card media-card--premium">
            
            <!-- BEM Element: media-card__cover -->
            <div class="media-card__cover">
                <!-- Implementasi Art Direction dengan elemen <picture> -->
                <picture>
                    <!-- Tampilan untuk layar besar (tablet/desktop) -->
                    <source media="(min-width: 768px)" srcset="src/elearning poster.jpg" type="image/webp">
                    
                    <!-- Tampilan untuk layar kecil (mobile) -->
                    <source media="(max-width: 767px)" srcset="src/elearning poster.jpg" type="image/webp">
                    
                    <!-- Fallback img -->
                    <img class="media-card__image" src="src/elearning poster.jpg" alt="Ilustrasi Sampul Materi Kuliah">
                </picture>
            </div>

            <!-- BEM Element: media-card__content -->
            <div class="media-card__content">
                <!-- Kita tambahkan judul dan deskripsi supaya kartunya berbentuk e-learning beneran -->
                <h2 class="media-card__title">Pengantar Struktur Data & Algoritma</h2>
                <p class="media-card__description">Materi video kali ini membahas konsep dasar mengenai struktur data yang bisa membantu mahasiswa teknik informatika mengenal struktur data, dan implementasi dengan c++</p>
                
                <!-- BEM Element: media-card__video-container -->
                <div class="media-card__video-container">
                    <!-- Atribut controls wajib ada biar user bisa play/pause -->
                    <!-- Atribut poster buat thumbnail video sebelum diputar -->
                    <video class="media-card__video" controls poster="https://placehold.co/800x450/png?text=Thumbnail+Video+Materi">

                        <!-- Format cadangan 1: MP4 (Standar industri yang paling aman, support hampir di semua browser) -->
                        <source src="src/strukturData.mp4" type="video/mp4">
                        
                        <!-- Fallback text kalau browser user beneran jadul banget dan gak support HTML5 video -->
                        Maaf, browser Anda tidak mendukung pemutar video HTML5. Silakan perbarui browser Anda.
                    </video>
                </div>
                
                
                <!-- BEM Element: media-card__audio-container -->
                <div class="media-card__audio-container">
                    <p class="media-card__audio-label">Versi Podcast (Hemat Kuota):</p>
                    <!-- Tag audio HTML5 dengan kontrol -->
                    <audio class="media-card__audio" controls>
                        <source src="src/strukturData.mp3" type="audio/mpeg">
                        <!-- Fallback jika browser jadul -->
                        Browser Anda tidak mendukung elemen audio.
                    </audio>
                </div>
            </div>
            
        </article>
    </main>

</body>
</html>
